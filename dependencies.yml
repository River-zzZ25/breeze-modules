manifest:

  defaults:
    remote: robotpilots

  remotes:
    - name: robotpilots
      url-base: https://github.com/RobotPilots-SZU
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: breeze
      path: breeze
      revision: main
      import: submanifests
    - name: algo
      path: algo
      revision: main
    - name: ramenx
      path: ramenx
      revision: main
    - name: zephyr
      remote: upstream
      revision: main
      path: zephyr
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - cmsis
          - cmsis_6
          - etl
          - cmsis-nn
          - cmsis-dsp
          - segger
          - hal_st
          - hal_stm32
          - fatfs
          - littlefs
          - picolibc
    - name: nanopb
      url: https://github.com/nanopb/nanopb
      revision: 0.4.9.2
    - name: rp-proto
      path: rp-proto
      revision: main
